[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
# Suite runs IN-CONTAINER only (host python is 3.14 without project deps);
# invoke via scripts/test.sh. asyncio_mode=auto so async tests need no marker.
asyncio_mode = "auto"
testpaths = ["tests"]
# xfail(strict=True) regression tests (C1/C2/C3/M2...) must ERROR when they
# start passing — that is the signal the underlying bug was fixed and the
# marker must be removed.
xfail_strict = false

[tool.ruff.lint]
# E712 trips on SQLAlchemy's `Model.col == True` / `== False` idiom which
# generates SQL `col = TRUE` (vs. `col` which evaluates the column object).
# We want to keep the explicit form for readability in ORM queries.
ignore = ["E712"]
