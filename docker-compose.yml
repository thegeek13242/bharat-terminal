version: "3.9"

# ── Reusable fragments ────────────────────────────────────────────────────────
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

x-common-env: &common-env
  KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  DATABASE_URL: postgresql+asyncpg://bharat:bharat@postgres:5432/bharat_terminal
  REDIS_URL: redis://redis:6379/0
  KB_SERVICE_URL: http://kb-service:8001
  PYTHONUNBUFFERED: "1"
  EXTRACTION_MODEL: ${EXTRACTION_MODEL:-gemini-2.5-flash}
  IMPACT_MODEL: ${IMPACT_MODEL:-gemini-2.5-flash}
  SIGNALS_MODEL: ${SIGNALS_MODEL:-gemini-3.1-pro-preview}
  DOSSIER_MODEL: ${DOSSIER_MODEL:-gemini-3.1-pro-preview}
  RELEVANCE_THRESHOLD: ${RELEVANCE_THRESHOLD:-0.35}
  # LLM routing: claude-* -> Vertex (AnthropicVertex) unless LLM_PROVIDER=anthropic;
  # gemini-* -> Vertex (google-genai). Auth via the VM service-account ADC.
  LLM_PROVIDER: ${LLM_PROVIDER:-vertex}
  VERTEX_PROJECT: ${VERTEX_PROJECT:-bharat-terminal}
  VERTEX_CLAUDE_REGION: ${VERTEX_CLAUDE_REGION:-global}
  VERTEX_GEMINI_REGION: ${VERTEX_GEMINI_REGION:-global}

services:

  # ── Infrastructure ─────────────────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg15
    container_name: bharat-postgres
    environment:
      POSTGRES_USER: bharat
      POSTGRES_PASSWORD: bharat
      POSTGRES_DB: bharat_terminal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bharat -d bharat_terminal"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: bharat-redis
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save ""
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  redpanda:
    image: redpandadata/redpanda:v23.3.8
    container_name: bharat-redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr redpanda:8082
      - --schema-registry-addr 0.0.0.0:8081
      - --rpc-addr 0.0.0.0:33145
      - --advertise-rpc-addr redpanda:33145
    ports:
      - "9092:9092"
      - "8081:8081"
      - "8082:8082"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped
    logging: *default-logging

  redpanda-init:
    image: redpandadata/redpanda:v23.3.8
    container_name: bharat-redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        rpk topic create raw.news.in \
          --brokers redpanda:9092 \
          --partitions 8 \
          --replicas 1 \
          --topic-config retention.ms=86400000 \
          --topic-config cleanup.policy=delete || true

        rpk topic create raw.news.dlq \
          --brokers redpanda:9092 \
          --partitions 2 \
          --replicas 1 \
          --topic-config retention.ms=604800000 \
          --topic-config cleanup.policy=delete || true

        rpk topic create raw.news.enriched.in \
          --brokers redpanda:9092 \
          --partitions 8 \
          --replicas 1 \
          --topic-config retention.ms=172800000 \
          --topic-config cleanup.policy=delete || true

        rpk topic create raw.sentiment.in \
          --brokers redpanda:9092 \
          --partitions 4 \
          --replicas 1 \
          --topic-config retention.ms=86400000 \
          --topic-config cleanup.policy=delete || true

        rpk topic create raw.commodity.in \
          --brokers redpanda:9092 \
          --partitions 6 \
          --replicas 1 \
          --topic-config retention.ms=21600000 \
          --topic-config cleanup.policy=delete || true

        rpk topic create analysed.commodity_shock.in \
          --brokers redpanda:9092 \
          --partitions 4 \
          --replicas 1 \
          --topic-config retention.ms=604800000 || true

        rpk topic create analysed.impact.in \
          --brokers redpanda:9092 \
          --partitions 8 \
          --replicas 1 \
          --topic-config retention.ms=604800000 || true

        rpk topic create analysed.sentiment.in \
          --brokers redpanda:9092 \
          --partitions 4 \
          --replicas 1 \
          --topic-config retention.ms=604800000 || true

        echo "Topics ready."
    restart: "no"

  redpanda-console:
    image: redpandadata/console:v2.4.3
    container_name: bharat-console
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
    volumes:
      - ./docker/redpanda-console-config.yml:/tmp/config.yml:ro
    ports:
      - "8080:8080"
    restart: unless-stopped
    logging: *default-logging

  # ── Database bootstrap (run once) ──────────────────────────────────────────

  kb-migrate:
    build:
      context: .
      dockerfile: docker/kb/Dockerfile
    container_name: bharat-kb-migrate
    depends_on:
      postgres:
        condition: service_healthy
    env_file: [".env"]
    environment:
      <<: *common-env
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    logging: *default-logging

  kb-seed:
    build:
      context: .
      dockerfile: docker/kb/Dockerfile
    container_name: bharat-kb-seed
    depends_on:
      kb-migrate:
        condition: service_completed_successfully
    env_file: [".env"]
    environment:
      <<: *common-env
    command: ["python", "-m", "bharat_terminal.kb.manage", "sync-all", "--tier", "nifty50", "--days", "30"]
    restart: "no"
    logging: *default-logging

  kb-backfill:
    build:
      context: .
      dockerfile: docker/kb/Dockerfile
    container_name: bharat-kb-backfill
    depends_on:
      kb-migrate:
        condition: service_completed_successfully
    env_file: [".env"]
    environment:
      <<: *common-env
    command: ["python", "-m", "bharat_terminal.kb.manage", "sync-all", "--tier", "all", "--days", "365"]
    restart: "no"
    logging: *default-logging
    profiles: ["backfill"]

  kb-monitor:
    build:
      context: .
      dockerfile: docker/kb/Dockerfile
    container_name: bharat-kb-monitor
    depends_on:
      kb-service:
        condition: service_healthy
    env_file: [".env"]
    environment:
      <<: *common-env
    command: ["python", "-m", "bharat_terminal.kb.manage", "monitor"]
    restart: unless-stopped
    logging: *default-logging

  # ── Application Services ───────────────────────────────────────────────────

  kb-service:
    build:
      context: .
      dockerfile: docker/kb/Dockerfile
    container_name: bharat-kb
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kb-migrate:
        condition: service_completed_successfully
    env_file: [".env"]
    environment:
      <<: *common-env
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys,json; d=json.load(urllib.request.urlopen('http://localhost:8001/health')); sys.exit(0 if d.get('status')=='ok' else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  # ingestion-worker note: third-party news adapters (ET/Mint/PTI/Reuters/
  # Investing/NDTV) are DISABLED by default since 2026-07-19 (primary-source
  # doctrine — see ingestion/main.py). Re-enable without rebuild:
  #   INGESTION_EXTRA_SOURCES: "PTI,REUTERS_INDIA"

  transcript-watcher:
    # Real-time concall transcript pipeline (A1): polls for new transcript
    # announcements (ingestion lands them within minutes of the exchange
    # filing), fetches the COMPLETE PDF text (never clipped), and runs the
    # LLM annotation pass (speakers/highlights). See kb/sync/transcript_sync.py.
    build:
      context: .
      dockerfile: docker/kb/Dockerfile
    container_name: bharat-transcript-watcher
    depends_on:
      postgres:
        condition: service_healthy
      kb-migrate:
        condition: service_completed_successfully
    env_file: [".env"]
    environment:
      <<: *common-env
      # v2 structuring prompts generate past the 120s default on long calls
      # (thinking models); transcript jobs are batch, not latency-bound.
      LLM_CALL_TIMEOUT_S: "300"
    command: ["python", "-m", "bharat_terminal.kb.sync.transcript_sync", "--watch"]
    restart: unless-stopped
    logging: *default-logging

  papertrade:
    # INTERNAL paper-trading pilot (Phase C of the trading-system plan):
    # consumes analysed.impact.in, applies the D-series signal rules +
    # v4.1 materiality gate, and records simulated positions with full
    # decision provenance into paper_trades. NO broker connection — paper
    # only. Requires migration 030 (boot reconciliation reads paper_trades).
    build:
      context: .
      dockerfile: docker/papertrade/Dockerfile
    container_name: bharat-papertrade
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kb-migrate:
        condition: service_completed_successfully
    env_file: [".env"]
    environment:
      <<: *common-env
      KB_SERVICE_URL: "http://kb-service:8001"
    volumes:
      # The v4.1 materiality-gate artifact (research-lab export, read-only).
      - ./exports:/app/exports:ro
    restart: unless-stopped
    logging: *default-logging

  analysis-worker:
    build:
      context: .
      dockerfile: docker/analysis/Dockerfile
    container_name: bharat-analysis
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      kb-service:
        condition: service_healthy
    env_file: [".env"]
    environment:
      <<: *common-env
    restart: unless-stopped
    logging: *default-logging

  sentiment-worker:
    build:
      context: .
      dockerfile: docker/sentiment/Dockerfile
    container_name: bharat-sentiment
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    env_file: [".env"]
    environment:
      <<: *common-env
    restart: unless-stopped
    logging: *default-logging

  commodity-engine:
    build:
      context: .
      dockerfile: docker/commodity/Dockerfile
    container_name: bharat-commodity
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kb-migrate:
        condition: service_completed_successfully
    env_file: [".env"]
    environment:
      <<: *common-env
    restart: unless-stopped
    logging: *default-logging

  research-runner:
    # On-demand batch agent that calibrates (symbol × trigger) betas via
    # BSE XBRL filings + web search and persists into trigger_betas /
    # fundamental_exposures. Invoke explicitly:
    #   docker compose run --rm research-runner seed
    #   docker compose run --rm research-runner run --symbols=RELIANCE --triggers=CRUDEOIL
    build:
      context: .
      dockerfile: docker/research/Dockerfile
    container_name: bharat-research
    depends_on:
      postgres:
        condition: service_healthy
      kb-migrate:
        condition: service_completed_successfully
    env_file: [".env"]
    environment:
      <<: *common-env
    profiles: ["research"]                    # opt-in; never auto-starts
    restart: "no"
    logging: *default-logging

  mcp-server:
    # Streamable-HTTP MCP server exposing NSE-sourced grounding data
    # (get_financials, get_price_returns) to any MCP-capable agent. Shares the
    # bharat_terminal.grounding query layer with the in-process dossier tools.
    #   docker compose --profile mcp up -d mcp-server
    build:
      context: .
      dockerfile: docker/mcp/Dockerfile
    container_name: bharat-mcp
    depends_on:
      postgres:
        condition: service_healthy
    env_file: [".env"]
    environment:
      <<: *common-env
    ports:
      - "8002:8002"
    profiles: ["mcp"]                          # opt-in; new prod network surface
    restart: unless-stopped
    logging: *default-logging

  ingestion-worker:
    build:
      context: .
      dockerfile: docker/ingestion/Dockerfile
    container_name: bharat-ingestion
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file: [".env"]
    environment:
      <<: *common-env
    restart: unless-stopped
    logging: *default-logging

  api-gateway:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: bharat-api
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kb-service:
        condition: service_healthy
    env_file: [".env"]
    environment:
      <<: *common-env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys,json; d=json.load(urllib.request.urlopen('http://localhost:8000/health')); sys.exit(0 if d.get('status')=='ok' else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  onboarding-worker:
    # Polls the landing edge for approved demo requests, creates the app_users
    # invite row, and sends the onboarding email. Reuses the api image (has
    # httpx + sqlalchemy + asyncpg + the code). Idles when the queue is empty.
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: bharat-onboarding
    depends_on:
      postgres:
        condition: service_healthy
    env_file: [".env"]
    environment:
      <<: *common-env
    command: ["python", "-m", "bharat_terminal.onboarding.provision_worker", "--loop"]
    healthcheck:
      disable: true
    restart: unless-stopped
    logging: *default-logging

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    container_name: bharat-frontend
    depends_on:
      - api-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
    logging: *default-logging

  # ── Observability ──────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: bharat-prometheus
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana:10.4.2
    container_name: bharat-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: bharat
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_TELEMETRY_REPORTING_ENABLED: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    logging: *default-logging

# ── Volumes ────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redpanda_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
