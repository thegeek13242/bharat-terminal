# HTTP → HTTPS redirect. Cloudflare connects to the origin on 443 (Full/Full-strict).
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Origin TLS. Cloudflare Origin CA cert (preferred) or self-signed stopgap.
    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Re-resolve the api upstream via Docker's embedded DNS (127.0.0.11) on a
    # short TTL. Without this, nginx resolves api-gateway ONCE at startup and
    # caches the IP — so when the api container is recreated (new IP) every
    # /api request 502s until the frontend is restarted. The variable in
    # proxy_pass below is what forces per-request resolution.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api-gateway:8000;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1000;
    gzip_proxied any;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache immutable hashed assets forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy REST API
    location /api/ {
        # A variable proxy_pass forces per-request DNS resolution, but it also
        # disables nginx's automatic location-prefix stripping — so strip /api/
        # explicitly (equivalent to the old `proxy_pass .../;` trailing slash).
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy WebSocket (Cloudflare forwards WS upgrades automatically)
    location /ws/ {
        # No rewrite needed: /ws/* maps 1:1 to the upstream /ws/* path.
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
